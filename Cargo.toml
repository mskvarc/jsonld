[workspace]
members = [
    "jsonld",
    "jsonld-cli",
    "jsonld-compaction",
    "jsonld-context-processing",
    "jsonld-core",
    "jsonld-expandable",
    "jsonld-expandable-core",
    "jsonld-expansion",
    "jsonld-serialization",
    "jsonld-syntax",
    "jsonld-testing",
    "jsonld-vocab",
]
resolver = "3"

[workspace.package]
version = "0.22.1"
edition = "2024"
rust-version = "1.96.0"
authors = [
    "Timothée Haudebourg <author@haudebourg.net>",
    "Matej Škvarč <matej.skvarc@senlab.io>",
]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mskvarc/jsonld/"
keywords = ["json-ld", "json", "semantic-web", "linked-data", "rdf"]
categories = ["web-programming", "database", "data-structures"]

[workspace.lints.rust]
async_fn_in_trait = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
too_many_arguments = "allow"
pedantic = { level = "warn", priority = -1 }
inline_always = "allow"
too_many_lines = "allow"
match_same_arms = "allow"
wildcard_enum_match_arm = "allow"
iter_without_into_iter = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
format_push_string = "allow"
# `Loader::load` is an async trait method; impls that resolve synchronously
# (no mount point, in-memory map) have no `.await`, which is not a defect.
unused_async_trait_impl = "allow"

[workspace.dependencies]
jsonld = { path = "jsonld", version = "0.22.0" }
jsonld-compaction = { path = "jsonld-compaction", version = "0.22.0" }
jsonld-context-processing = { path = "jsonld-context-processing", version = "0.22.0" }
jsonld-core = { path = "jsonld-core", version = "0.22.0" }
jsonld-expandable = { path = "jsonld-expandable", version = "0.22.0" }
jsonld-expandable-core = { path = "jsonld-expandable-core", version = "0.22.0" }
jsonld-expansion = { path = "jsonld-expansion", version = "0.22.0" }
jsonld-serialization = { path = "jsonld-serialization", version = "0.22.0" }
jsonld-syntax = { path = "jsonld-syntax", version = "0.22.0" }
jsonld-testing = { path = "jsonld-testing", version = "0.22.0" }
jsonld-vocab = { path = "jsonld-vocab", version = "0.22.0" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false

[profile.bench]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = false

[profile.profiling]
inherits = "release"
debug = "full"
strip = false
