[package]
name = "jsonld-compaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "JSON-LD document compaction implementation"
documentation = "https://docs.rs/jsonld-compaction"
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["fast-hash"]
fast-hash = [
    "iri-rs/fast-hash",
    "jsonld-core/fast-hash",
    "jsonld-syntax/fast-hash",
    "jsonld-context-processing/fast-hash",
]
parallel = ["jsonld-core/parallel"]

[dependencies]
contextual = "0.1.6"
educe = "0.6.0"
futures = "0.3.32"
indexmap = "2.14.0"
iri-rs = "3.3.6"
jsonld-context-processing.workspace = true
jsonld-core.workspace = true
jsonld-expansion.workspace = true
jsonld-syntax.workspace = true
jstrict = "0.13.0"
langtag = "1.1.0"
mown = "1.0.0"
rdfx = "0.23.2"
smallvec = "1.15.1"
thiserror = "2.0.18"

[lints]
workspace = true
