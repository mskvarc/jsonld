[package]
name = "jsonld-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "JSON-LD core types and traits"
documentation = "https://docs.rs/jsonld-core"
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
# The `gxhash` feature hard-fails without AES intrinsics; docs.rs applies
# rustc-args as extra RUSTFLAGS, so this reaches the gxhash dependency build.
rustc-args = ["-C", "target-cpu=native"]

[features]
default = ["fast-hash"]
fast-hash = ["iri-rs/fast-hash", "jsonld-syntax/fast-hash"]
reqwest = ["dep:reqwest", "utf8-decode", "reqwest-middleware"]
serde = ["dep:serde", "jstrict/serde", "jsonld-syntax/serde"]
serde-json = [
    "dep:serde_json",
    "jstrict/serde_json",
    "jsonld-syntax/serde-json",
]
ahash = ["jsonld-syntax/ahash"]
gxhash = ["jsonld-syntax/gxhash"]

[dependencies]
contextual = "0.1.6"
educe = "0.7.4"
foldhash = "0.2.0"
hashbrown = "0.17.1"
indexmap = "2.14.0"
iri-rs = { version = "3.3.7", features = ["static"] }
jsonld-syntax.workspace = true
jstrict = { version = "0.14.0", features = ["contextual", "canonicalize"] }
langtag = "1.1.0"
ld-core = "0.4.0"
log = "0.4.33"
mediatype = "0.22.0"
once_cell = "1.21.4"
parking_lot = "0.12.5"
pretty_dtoa = "0.3.0"
rdfx = "0.24.0"
reqwest = { version = "0.13.4", optional = true }
reqwest-middleware = { version = "0.5.2", optional = true }
ryu-js = "1.0.3"
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.151", optional = true }
smallvec = "1.15.2"
thiserror = "2.0.19"
utf8-decode = { version = "2.0.0", optional = true }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
