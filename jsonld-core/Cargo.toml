[package]
name = "jsonld-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "JSON-LD core types and traits"
documentation = "https://docs.rs/jsonld-core"
readme = "README.md"

[features]
default = []
reqwest = ["bytes", "dep:reqwest", "utf8-decode", "reqwest-middleware"]
serde = ["dep:serde", "json-syntax/serde"]

[dependencies]
bytes = { version = "1.11.1", optional = true }
contextual = "0.1.6"
educe = "0.6.0"
futures = "0.3.32"
hashbrown = "0.17.0"
indexmap = "2.14.0"
iref = "3.2.2"
jsonld-syntax.workspace = true
json-syntax = { version = "0.12.5", features = ["contextual", "canonicalize"] }
langtag = "0.4.0"
linked-data = "0.1.2"
log = "0.4.29"
mime = "0.3.17"
once_cell = "1.21.4"
permutohedron = "0.2.4"
pretty_dtoa = "0.3.0"
rdf-types = { version = "0.22.5", features = ["contextual"] }
reqwest = { version = "0.13.2", optional = true }
reqwest-middleware = { version = "0.5.1", optional = true }
ryu-js = "0.2.2"
serde = { version = "1.0.228", optional = true }
smallvec = "1.15.1"
static-iref = "3.0.0"
thiserror = "2.0.18"
utf8-decode = { version = "2.0.0", optional = true }
