[package]
name = "jsonld-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "JSON-LD core types and traits"
documentation = "https://docs.rs/jsonld-core"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
# Enables the `doc(auto_cfg)` attribute in lib.rs, which labels each
# feature-gated item with the feature that unlocks it.
rustdoc-args = ["--cfg", "docsrs"]
# The `gxhash` feature hard-fails without AES intrinsics; docs.rs applies
# rustc-args as extra RUSTFLAGS, so this reaches the gxhash dependency build.
rustc-args = ["-C", "target-cpu=native"]

[features]
default = ["bytewise-iri"]
bytewise-iri = ["iri-rs/bytewise", "jsonld-syntax/bytewise-iri"]
reqwest = ["dep:reqwest", "utf8-decode", "reqwest-middleware"]
serde = ["dep:serde", "jstrict/serde", "jsonld-syntax/serde"]
serde-json = [
    "dep:serde_json",
    "jstrict/serde_json",
    "jsonld-syntax/serde-json",
]
sonic-rs = [
    "dep:sonic-rs",
    "jstrict/sonic-rs",
    "jsonld-syntax/sonic-rs",
]
ahash = ["jsonld-syntax/ahash"]
gxhash = ["jsonld-syntax/gxhash"]

[dependencies]
contextual = "0.1.6"
derive-where = "1.6.1"
foldhash = "0.2.0"
hashbrown = "0.17.1"
indexmap = "2.14.2"
iri-rs = { version = "3.4.1", features = ["static"] }
jsonld-syntax.workspace = true
jstrict = { version = "0.15.0", features = ["contextual", "canonicalize"] }
langtag = "1.1.0"
ld-core = "0.5.0"
log = "0.4.34"
mediatype = "0.23.0"
once_cell = "1.21.4"
parking_lot = "0.12.5"
pretty_dtoa = "0.3.0"
rdfx = "0.24.0"
reqwest = { version = "0.13.5", optional = true }
reqwest-middleware = { version = "0.5.2", optional = true }
ryu-js = "1.0.3"
serde = { version = "1.0.229", optional = true }
serde_json = { version = "1.0.151", optional = true }
smallvec = "1.16.1"
sonic-rs = { version = "0.5.10", optional = true }
thiserror = "2.0.20"
utf8-decode = { version = "2.0.0", optional = true }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
