[package]
name = "jsonld-expandable-core"
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Runtime traits, attribute parser, and codegen for the JSON-LD `Expandable` derive"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
serde-json = ["dep:serde_json"]
sonic-rs = ["dep:sonic-rs"]
jstrict = ["dep:jstrict"]
chrono = ["dep:chrono"]

[dependencies]
chrono = { version = "0.4.45", optional = true, default-features = false, features = ["alloc"] }
jstrict = { version = "0.14.0", optional = true }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde_json = { version = "1.0.151", optional = true }
sonic-rs = { version = "0.5.8", optional = true }
syn = { version = "3.0.3", features = ["full", "extra-traits"] }

[lints]
workspace = true
