[package]
name = "jsonld-expandable-core"
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Runtime traits, attribute parser, and codegen for the JSON-LD `Expandable` derive"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Attribute parser, IR, and codegen used by the `jsonld-expandable` derive.
# Only the derive crate needs this; runtime consumers should leave it off so
# syn/quote/proc-macro2 stay out of their dependency graph.
codegen = ["dep:proc-macro2", "dep:quote", "dep:syn"]
serde-json = ["dep:serde_json"]
sonic-rs = ["dep:sonic-rs"]
jstrict = ["dep:jstrict"]
chrono = ["dep:chrono"]

[dependencies]
chrono = { version = "0.4.45", optional = true, default-features = false, features = ["alloc"] }
jstrict = { version = "0.14.0", optional = true }
proc-macro2 = { version = "1.0.107", optional = true }
quote = { version = "1.0.47", optional = true }
serde_json = { version = "1.0.151", optional = true }
sonic-rs = { version = "0.5.8", optional = true }
syn = { version = "3.0.3", features = ["full", "extra-traits"], optional = true }

[dev-dependencies]
# Self-reference so `cargo test` exercises every feature-gated module (codegen
# for the attrs/IR tests, the three JSON backends, chrono interop) without
# forcing those features on downstream consumers.
jsonld-expandable-core = { path = ".", features = ["codegen", "serde-json", "sonic-rs", "jstrict", "chrono"] }

[lints]
workspace = true
