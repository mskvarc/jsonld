[package]
name = "jsonld-expandable"
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Derive macro for JSON-LD `Expandable` types (see jsonld-expandable-core for runtime traits)"

[lib]
proc-macro = true

[dependencies]
jsonld-expandable-core.workspace = true
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[dev-dependencies]
jsonld-expandable-core = { workspace = true, features = ["serde_json"] }
serde_json = "1.0"
trybuild = { version = "1.0", features = ["diff"] }

[lints]
workspace = true
