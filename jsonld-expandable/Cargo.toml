[package]
name = "jsonld-expandable"
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Derive macro for JSON-LD `Expandable` types (see jsonld-expandable-core for runtime traits)"

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
jsonld-expandable-core.workspace = true
proc-macro2 = "1.0.107"
syn = { version = "3.0.3", features = ["full", "extra-traits"] }

[dev-dependencies]
jsonld-expandable-core = { workspace = true, features = ["serde-json"] }
serde_json = "1.0.151"
trybuild = { version = "1.0.118", features = ["diff"] }

[lints]
workspace = true
