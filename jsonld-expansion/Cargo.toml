[package]
name = "jsonld-expansion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "JSON-LD document expansion implementation"
documentation = "https://docs.rs/jsonld-expansion"
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo-machete]
# Used only by the doc test in `src/lib.rs`, which cargo-machete does not parse.
ignored = ["iri-rs", "jsonld", "tokio"]

[features]
default = ["fast-hash"]
fast-hash = [
    "jsonld-core/fast-hash",
    "jsonld-syntax/fast-hash",
    "jsonld-context-processing/fast-hash",
]

[dependencies]
contextual = "0.1.6"
jsonld-context-processing.workspace = true
jsonld-core.workspace = true
jsonld-syntax.workspace = true
jstrict = "0.14.0"
langtag = "1.1.0"
rdfx = "0.24.0"
smallvec = "1.15.2"
thiserror = "2.0.19"

[dev-dependencies]
iri-rs = { version = "3.3.7", features = ["static"] }
# Path-only (no version) so `cargo package` strips this dev-dep. `jsonld`
# depends on this crate, so a versioned entry would make `cargo publish` demand
# `jsonld` on crates.io before this crate can be published — a deadlock. Used
# only by the crate-level doc example.
jsonld = { path = "../jsonld" }
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
