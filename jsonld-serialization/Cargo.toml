[package]
name = "jsonld-serialization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "JSON-LD serialization"
documentation = "https://docs.rs/jsonld-serialization"
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["fast-hash"]
fast-hash = ["iri-rs/fast-hash", "jsonld-core/fast-hash"]

[dependencies]
indexmap = "2.14.0"
iri-rs = "3.3.5"
jsonld-core.workspace = true
jstrict = "0.13.0"
ld-core = "0.2.0"
rdfx = "0.23.1"
thiserror = "2.0.18"
xsd-rs = "0.10.0"

[dev-dependencies]
contextual = "0.1.6"
jstrict = "0.13.0"
ld-core = { version = "0.2.0", features = [
    "derive",
] }

[lints]
workspace = true
