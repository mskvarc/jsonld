[package]
name = "jsonld-serialization"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "JSON-LD serialization"
documentation = "https://docs.rs/jsonld-serialization"
readme = "README.md"

[features]
default = ["fast-hash"]
fast-hash = ["iri-rs/fast-hash", "jsonld-core/fast-hash"]

[dependencies]
indexmap = "2.14.0"
iri-rs = "3.3.4"
jsonld-core.workspace = true
json-syntax = "0.12.5"
ld-core = { git = "ssh://git@github.com/mskvarc/ld-core.git" }
rdf-rs = { git = "ssh://git@github.com/mskvarc/rdf-rs.git" }
thiserror = "2.0.18"
xsd-rs = { git = "ssh://git@github.com/mskvarc/xsd-rs.git" }

[dev-dependencies]
contextual = "0.1.6"
json-syntax = "0.12.5"
ld-core = { git = "ssh://git@github.com/mskvarc/ld-core.git", features = [
    "derive",
] }
