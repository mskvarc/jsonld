[package]
name = "jsonld-syntax"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "JSON-LD syntax"
documentation = "https://docs.rs/jsonld-syntax"
readme.workspace = true

[package.metadata.docs.rs]
all-features = true
# Enables the `doc(auto_cfg)` attribute in lib.rs, which labels each
# feature-gated item with the feature that unlocks it.
rustdoc-args = ["--cfg", "docsrs"]
# The `gxhash` feature hard-fails without AES intrinsics; docs.rs applies
# rustc-args as extra RUSTFLAGS, so this reaches the gxhash dependency build.
rustc-args = ["-C", "target-cpu=native"]

[features]
default = ["bytewise-iri"]
bytewise-iri = ["iri-rs/fast-hash"]
serde = [
    "dep:serde",
    "iri-rs/serde",
    "jstrict/serde",
    "indexmap/serde",
]
serde-json = ["jstrict/serde_json"]
sonic-rs = ["jstrict/sonic-rs"]
ahash = ["dep:ahash"]
gxhash = ["dep:gxhash"]

[dependencies]
ahash = { version = "0.8.12", optional = true }
contextual = "0.1.6"
educe = "0.7.6"
gxhash = { version = "3.5.0", optional = true }
hashbrown = "0.17.1"
indexmap = "2.14.0"
iri-rs = "3.3.7"
jstrict = "0.14.0"
langtag = "1.1.0"
lasso = { version = "0.7.3", features = ["multi-threaded", "inline-more", "ahasher"] }
rdfx = "0.24.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }
smallvec = "1.15.2"
thiserror = "2.0.19"

[lints]
workspace = true
