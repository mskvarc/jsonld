[package]
name = "jsonld-syntax"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "JSON-LD syntax"
documentation = "https://docs.rs/jsonld-syntax"
readme = "README.md"

[features]
default = ["fast-hash"]
fast-hash = ["iri-rs/fast-hash"]
serde = [
    "dep:serde",
    "iri-rs/serde",
    "locspan/serde",
    "json-syntax/serde",
    "indexmap/serde",
]
ahash = ["dep:ahash"]
gxhash = ["dep:gxhash"]

[dependencies]
ahash = { version = "0.8", optional = true }
contextual = "0.1.6"
decoded-char = "0.1.1"
educe = "0.6.0"
gxhash = { version = "3", optional = true }
hashbrown = "0.17.0"
indexmap = "2.14.0"
iri-rs = "3.3.4"
json-syntax = "0.12.5"
langtag = "1.1.0"
lasso = { version = "0.7", features = ["multi-threaded"] }
locspan = "0.8.2"
rdf-rs = { git = "ssh://git@github.com/mskvarc/rdf-rs.git" }
serde = { version = "1.0.228", features = ["derive"], optional = true }
smallvec = "1.15.1"
thiserror = "2.0.18"
