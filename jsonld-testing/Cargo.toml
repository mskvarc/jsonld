[package]
name = "jsonld-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "Testing library for the `jsonld` library"
readme.workspace = true
# Not published: this is a compile-time harness that needs the W3C manifests
# mounted in the consumer's CARGO_MANIFEST_DIR and assumes direct `jsonld` and
# `iri-rs` dependencies — it has no crates.io audience. Keeping it private also
# breaks the jsonld <-> jsonld-testing publish cycle. Note: this crate opts out
# of the workspace deny-lints on purpose; panicking in a proc macro surfaces as
# a compile-time diagnostic, not a runtime risk.
publish = false

[lib]
proc-macro = true

[dependencies]
contextual = "0.1.6"
iri-rs = { version = "3.3.7", features = ["static", "enum"] }
jsonld.workspace = true
proc-macro2 = "1.0.107"
quote = "1.0.47"
rdfx = { version = "0.24.0", features = ["contextual"] }
syn = { version = "3.0.3", features = ["full"] }
tokio = { version = "1.53.1", features = ["rt"] }
yansi = "1.0.1"
