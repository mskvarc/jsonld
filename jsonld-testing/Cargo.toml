[package]
name = "jsonld-testing"
version.workspace = true
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
description = "Testing library for the `jsonld` library"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
async-std = "1.13.2"
contextual = "0.1.6"
iref = "3.2.2"
iref-enum = "3.0.0"
jsonld.workspace = true
litrs = "1.0.0"
proc-macro2 = "1.0.106"
proc-macro-error = "1.0.4"
quote = "1.0.45"
rdf-types = { version = "0.22.5", features = ["contextual"] }
static-iref = "3.0.0"
syn = { version = "2.0.117", features = ["full"] }
yansi = "1.0.1"
