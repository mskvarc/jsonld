[package]
name = "jsonld-vocab"
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
version.workspace = true
description = "Proc-macro that generates typed JSON-LD vocabulary constants from local JSON-LD context files"
documentation = "https://docs.rs/jsonld-vocab"

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.107"
# Resolves how the calling crate depends on `iri-rs`, so the generated
# constants need no crate-path configuration.
proc-macro-crate = "3.5.0"
quote = "1.0.47"
serde_json = "1.0.151"
syn = { version = "3.0.3", features = ["full", "extra-traits"] }

[dev-dependencies]
iri-rs = { version = "3.3.7", features = ["static"] }
trybuild = { version = "1.0.118", features = ["diff"] }

[lints]
workspace = true
