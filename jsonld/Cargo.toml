[package]
name = "jsonld"
edition.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
description = "JSON-LD implementation"
readme = "README.md"

[features]
default = ["fast-hash"]
fast-hash = [
    "iri-rs/fast-hash",
    "jsonld-core/fast-hash",
    "jsonld-syntax/fast-hash",
    "jsonld-context-processing/fast-hash",
    "jsonld-expansion/fast-hash",
    "jsonld-compaction/fast-hash",
    "jsonld-serialization/fast-hash",
]
reqwest = ["jsonld-core/reqwest"]
serde = ["jsonld-syntax/serde", "jsonld-core/serde"]
serde_json = ["jsonld-syntax/serde_json", "jsonld-core/serde_json"]
ahash = ["jsonld-core/ahash"]
gxhash = ["jsonld-core/gxhash"]

[dependencies]
contextual = "0.1.6"
futures = "0.3.32"
iri-rs = "3.3.4"
jsonld-compaction.workspace = true
jsonld-context-processing.workspace = true
jsonld-core.workspace = true
jsonld-expansion.workspace = true
jsonld-serialization.workspace = true
jsonld-syntax.workspace = true
jstrict = { git = "ssh://git@github.com/mskvarc/jstrict.git" }
locspan = "0.8.2"
rdf-rs = { git = "ssh://git@github.com/mskvarc/rdf-rs.git" }
thiserror = "2.0.18"

[dev-dependencies]
async-std = { version = "1.13.2", features = ["attributes"] }
criterion = "0.8.2"
serde_json = "1.0"
iri-rs = { version = "3.3.4", features = ["static"] }
jsonld-testing.workspace = true
log = "0.4.29"
mimalloc = { version = "0.1", default-features = false }
n-quads = { git = "ssh://git@github.com/mskvarc/n-quads.git" }
stacker = "0.1.24"

[[bench]]
name = "expansion"
harness = false

[[bench]]
name = "compaction"
harness = false

[[example]]
name = "profile"
path = "examples/profile.rs"

[package.metadata.docs.rs]
all-features = true
